<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="中秋玉兔">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#123a86"/>
      <stop offset="100%" stop-color="#011a56"/>
    </linearGradient>
    <linearGradient id="fur" x1="0.2" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fdfaf5"/>
      <stop offset="100%" stop-color="#ece1d6"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbcbc5"/>
      <stop offset="100%" stop-color="#f0a19e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#ffe3a8"/>
      <stop offset="100%" stop-color="#dda03a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#7fb2ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7fb2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <circle cx="64" cy="62" r="54" fill="url(#glow)"/>

  <!-- 长耳 -->
  <g transform="rotate(-13 47 43)">
    <ellipse cx="47" cy="43" rx="10" ry="27" fill="url(#fur)"/>
    <ellipse cx="47" cy="44" rx="4.8" ry="18.5" fill="url(#inner)"/>
  </g>
  <g transform="rotate(13 81 43)">
    <ellipse cx="81" cy="43" rx="10" ry="27" fill="url(#fur)"/>
    <ellipse cx="81" cy="44" rx="4.8" ry="18.5" fill="url(#inner)"/>
  </g>

  <!-- 头 -->
  <ellipse cx="64" cy="75" rx="31.5" ry="28.5" fill="url(#fur)"/>

  <!-- 腮红 -->
  <ellipse cx="41.5" cy="80" rx="6.2" ry="3.8" fill="#f6b2ae" opacity="0.75"/>
  <ellipse cx="86.5" cy="80" rx="6.2" ry="3.8" fill="#f6b2ae" opacity="0.75"/>

  <!-- 眼睛 -->
  <ellipse cx="51.5" cy="71" rx="5.6" ry="6.6" fill="#3a2b23"/>
  <circle cx="49.4" cy="68.3" r="2.1" fill="#ffffff"/>
  <circle cx="53.6" cy="74" r="1.05" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="76.5" cy="71" rx="5.6" ry="6.6" fill="#3a2b23"/>
  <circle cx="74.4" cy="68.3" r="2.1" fill="#ffffff"/>
  <circle cx="78.6" cy="74" r="1.05" fill="#ffffff" opacity="0.8"/>

  <!-- 鼻与嘴 -->
  <path d="M64 79.6c-1.9 0-3.4 1.2-3.4 2.4 0 1.5 1.7 2.4 3.4 2.4s3.4-.9 3.4-2.4c0-1.2-1.5-2.4-3.4-2.4z" fill="#e8909a"/>
  <path d="M64 84.4v2.5" stroke="#bb9296" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M64 86.9c-1.3 1.9-3.4 1.9-4.6 0.3M64 86.9c1.3 1.9 3.4 1.9 4.6 0.3" stroke="#bb9296" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 蓝项圈 + 金月饼 -->
  <path d="M37 97.5c17 8.5 37 8.5 54 0" stroke="#3f8ff0" stroke-width="5.6" fill="none" stroke-linecap="round"/>
  <circle cx="64" cy="106.5" r="9" fill="url(#gold)"/>
  <circle cx="64" cy="106.5" r="6.6" fill="none" stroke="#cf8a3a" stroke-width="1.2"/>
  <circle cx="64" cy="106.5" r="2.4" fill="#cd8236"/>
  <ellipse cx="64" cy="100.4" rx="2" ry="2.6" fill="#cd8236"/>
  <ellipse cx="64" cy="112.6" rx="2" ry="2.6" fill="#cd8236"/>
  <ellipse cx="58.1" cy="106.5" rx="2.6" ry="2" fill="#cd8236"/>
  <ellipse cx="69.9" cy="106.5" rx="2.6" ry="2" fill="#cd8236"/>
</svg>
